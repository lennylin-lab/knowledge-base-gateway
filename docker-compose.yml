# Gateway-owned container stack: one-shot migration + gateway in database-backed mode.
#
# Storage dependencies (PostgreSQL and Redis) are intentionally NOT orchestrated
# in this repository. Provision them externally (via knowledge-base-database or
# knowledge-base-deploy) and supply connection settings through .env or process
# environment variables. Whenever storage requirements change, publish change
# notes to ../knowledge-base-docs/subsystems/database/ and
# ../knowledge-base-docs/subsystems/deploy/ so those subsystems handle them.
#
# Dependency order:
#
#   external PostgreSQL & Redis ready
#     --> migrate "up" completed successfully --> gateway ready
#
# Security: the gateway and migrate services reuse the image built by
# Dockerfile, which runs as uid 10001 (non-root). No provider secret, API
# key, or DSN is baked into the image; everything below is run-time
# configuration. Destructive rollback (`migrate down`) is intentionally not
# wired into this file; `up` is idempotent.
#
# Host ports default to values that do not collide with a co-existing
# knowledge-base-server stack; override via the *_HOST_PORT variables
# documented in README.md.

name: kb-gateway

x-app-image: &app-image
  image: ${GATEWAY_IMAGE:-kb-gateway:local}
  build:
    context: .
    dockerfile: Dockerfile

services:
  # One-shot migration job: applies pending migrations against the external
  # PostgreSQL database and exits 0. Idempotent for `up` (a fully-applied
  # schema is a successful no-op). Never rolls back.
  # entrypoint is reset because the image entrypoint is the gateway binary.
  migrate:
    <<: *app-image
    entrypoint: ["/app/migrate"]
    command: ["-dir", "/app/migrations", "up"]
    environment:
      GATEWAY_DATABASE_URL: ${GATEWAY_DATABASE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"
    security_opt:
      - no-new-privileges:true

  # Production-shaped mode: catalog/routes/policies/keys from external
  # PostgreSQL; rate/concurrency limits and quotas via external Redis (or
  # GATEWAY_LIMITS_MODE=local for single-instance local development).
  # Development-only GATEWAY_API_KEYS / GATEWAY_MODELS / GATEWAY_PROVIDER are
  # deliberately absent; the seeded fake provider registry needs no credentials.
  #
  # The admin token follows the throwaway-password policy: a deterministic
  # default keeps the local stack self-contained (the smoke mints keys through
  # it); production deployments set their own GATEWAY_ADMIN_TOKEN. The admin
  # port is published to loopback only.
  gateway:
    <<: *app-image
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      GATEWAY_DATABASE_URL: ${GATEWAY_DATABASE_URL:-}
      GATEWAY_LIMITS_MODE: ${GATEWAY_LIMITS_MODE:-redis}
      GATEWAY_REDIS_ADDR: ${GATEWAY_REDIS_ADDR:-}
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:-smoke-admin-throwaway}
      # Reasoning models legitimately pause between stream frames while
      # thinking (gpt-5.5 pauses of 30-45s were observed mid-tool-call); the
      # 30s default stall window truncates those runs, so dev widens it.
      GATEWAY_STREAM_STALL_TIMEOUT: ${GATEWAY_STREAM_STALL_TIMEOUT:-2m}
      # OTLP trace export passthrough so .env values reach the container.
      # NOTE: inside the container "localhost:4318" is the gateway itself —
      # point GATEWAY_OTLP_ENDPOINT at the collector's in-network address
      # (or host.docker.internal:4318 for a host-side collector).
      GATEWAY_OTLP_ENABLED: ${GATEWAY_OTLP_ENABLED:-false}
      GATEWAY_OTLP_ENDPOINT: ${GATEWAY_OTLP_ENDPOINT:-localhost:4318}
      GATEWAY_OTLP_INSECURE: ${GATEWAY_OTLP_INSECURE:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_KEY__OPENAI_PRIMARY: ${OPENAI_API_KEY__OPENAI_PRIMARY:-}
      OPENAI_API_KEY__OPENAI_EMBED: ${OPENAI_API_KEY__OPENAI_EMBED:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8091}:8080"
      - "127.0.0.1:${GATEWAY_ADMIN_HOST_PORT:-8092}:8081"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
