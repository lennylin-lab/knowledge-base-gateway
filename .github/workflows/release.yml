# Build the gateway container image and publish it to GitHub Container
# Registry (GHCR) when a version tag is pushed (v*). Nothing secret is baked
# into the image: credentials, DSNs, and API keys are injected at run time.
#
# Production deploy sketch:
#   export GATEWAY_IMAGE=ghcr.io/<owner>/knowledge-base-gateway:v1.3
#   docker compose pull
#   docker compose up -d    # migrate job runs, then gateway starts
#
# Tag a release:
#   git tag v1.3 && git push origin v1.3

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and publish container image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
